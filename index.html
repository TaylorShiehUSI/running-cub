<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🏃 馬兒一年千里目標啟動 第26次團練 - 線上報名</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      background-color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .line-green {
      background-color: #06C755;
    }
    .line-green:hover {
      background-color: #05b34c;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 pb-12">

  <!-- 頂部導覽列 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-4 py-3 shadow-sm">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xl">🏃</span>
        <div>
          <div class="text-xs font-semibold text-emerald-600">第 26 次例行團練</div>
          <div class="text-sm font-bold text-slate-800">馬兒一年千里目標啟動</div>
        </div>
      </div>
      <div id="conn-pill" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-50 text-amber-700 border border-amber-200">
        <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
        <span id="conn-text">連線同步中</span>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 mt-4 space-y-4">

    <!-- 活動視覺卡片 -->
    <section class="bg-gradient-to-br from-emerald-600 to-teal-700 text-white rounded-2xl p-5 shadow-sm">
      <div class="flex items-center justify-between mb-2">
        <span class="px-2.5 py-0.5 rounded-full text-xs bg-white/20 font-medium tracking-wide">都會公園歡樂跑</span>
        <span class="text-xs text-emerald-100 font-mono">10/14 (三) 06:00 起跑</span>
      </div>
      <h1 class="text-xl font-bold mb-1">🏃 馬兒一年千里目標啟動 第26次團練</h1>
      <p class="text-xs text-emerald-100 mb-3">來都會歡樂跑步，請踴躍報名！大家一起累積里程！</p>
      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-xl bg-black/15 text-xs text-amber-300 font-medium">
        <span>✨</span> 只有累積，沒有奇蹟！
      </div>

      <!-- 統計數字 -->
      <div class="grid grid-cols-4 gap-2 mt-4 text-center">
        <div class="bg-white/10 rounded-xl p-2 backdrop-blur-sm">
          <div id="stat-count" class="text-lg font-bold">0</div>
          <div class="text-[10px] text-emerald-100">目前報名</div>
        </div>
        <div class="bg-white/10 rounded-xl p-2 backdrop-blur-sm">
          <div class="text-lg font-bold">30</div>
          <div class="text-[10px] text-emerald-100">名額上限</div>
        </div>
        <div class="bg-white/10 rounded-xl p-2 backdrop-blur-sm">
          <div class="text-lg font-bold">10/14</div>
          <div class="text-[10px] text-emerald-100">團練日期</div>
        </div>
        <div class="bg-white/10 rounded-xl p-2 backdrop-blur-sm">
          <div class="text-lg font-bold">06:00</div>
          <div class="text-[10px] text-emerald-100">集合時間</div>
        </div>
      </div>
    </section>

    <!-- 跑友身份卡片 -->
    <section id="liff-profile-card" class="hidden bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <img id="user-avatar" src="" class="w-10 h-10 rounded-full border border-slate-200 object-cover" />
          <div>
            <div class="text-[11px] text-slate-400">LINE 已驗證身份</div>
            <div id="user-name" class="text-sm font-bold text-slate-800">讀取中...</div>
          </div>
        </div>
        <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 font-medium">LINE LIFF 連線</span>
      </div>
    </section>

    <!-- 報名表單 -->
    <section class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
      <h2 class="text-sm font-bold text-slate-800 mb-3 flex items-center gap-1.5">
        <span>✍️</span> 線上接龍報名表單
      </h2>

      <!-- 隱藏 iframe 接收回應，徹底避開 CORS -->
      <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted){onFormSubmitSuccess();}"></iframe>

      <form id="reg-form" target="hidden_iframe" method="POST"
        action="https://script.google.com/macros/s/AKfycbyzKdwldP0dW6FK6sMwz4LVF89njztvzLiODozGtNf_kdKZfHHM1u84yX43cq5eOs7skg/exec" class="space-y-3.5">
        
        <input type="hidden" name="action" value="register">
        <input type="hidden" name="activity_id" value="running-cub-run26">
        <input type="hidden" name="line_user_id" id="hidden-line-id" value="">

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">
            跑友姓名 / 暱稱 <span class="text-red-500">*</span>
          </label>
          <input type="text" name="nickname" id="input-nickname" required maxlength="20"
            class="w-full text-sm px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500"
            placeholder="請輸入稱呼">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">
            預計跑量 / 配速 <span class="text-red-500">*</span>
          </label>
          <input type="text" name="running_plan" id="input-plan" required maxlength="50"
            class="w-full text-sm px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500"
            placeholder="例：10K / 6分速">
          <div class="flex gap-1.5 mt-2">
            <button type="button" class="pace-btn text-xs bg-slate-100 hover:bg-slate-200 active:bg-slate-300 px-2.5 py-1.5 rounded-lg text-slate-700 font-medium transition cursor-pointer select-none" data-plan="5K / 歡樂跑">5K 歡樂跑</button>
            <button type="button" class="pace-btn text-xs bg-slate-100 hover:bg-slate-200 active:bg-slate-300 px-2.5 py-1.5 rounded-lg text-slate-700 font-medium transition cursor-pointer select-none" data-plan="10K / 6分速">10K 6分速</button>
            <button type="button" class="pace-btn text-xs bg-slate-100 hover:bg-slate-200 active:bg-slate-300 px-2.5 py-1.5 rounded-lg text-slate-700 font-medium transition cursor-pointer select-none" data-plan="12K / 5分半">12K 5分半</button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">備註（選填）</label>
          <input type="text" name="note" id="input-note" maxlength="100"
            class="w-full text-sm px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500"
            placeholder="如攜伴、特殊提醒">
        </div>

        <div id="form-msg" class="hidden p-3 rounded-xl text-xs font-medium"></div>

        <button type="submit" id="btn-submit"
          class="w-full line-green text-white font-medium py-3 rounded-xl shadow transition duration-150 flex items-center justify-center gap-1.5 cursor-pointer">
          <span id="btn-text">確認送出報名</span>
        </button>
      </form>
    </section>

    <!-- 名冊表格 -->
    <section class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
      <div class="flex items-center justify-between mb-3">
        <div>
          <h2 class="text-sm font-bold text-slate-800">📊 即時團練名冊</h2>
          <p class="text-[11px] text-slate-400">雙向同步自 Google 試算表</p>
        </div>
        <button type="button" onclick="loadRosterDirectly()" class="text-xs text-emerald-600 hover:text-emerald-700 px-2 py-1 rounded-lg hover:bg-emerald-50 transition cursor-pointer">
          🔄 重新整理
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead>
            <tr class="border-b border-slate-100 text-slate-400">
              <th class="py-2 px-1">#</th>
              <th class="py-2 px-2">姓名</th>
              <th class="py-2 px-2">跑量 / 配速</th>
              <th class="py-2 px-2">備註</th>
              <th class="py-2 px-1 text-right">狀態</th>
            </tr>
          </thead>
          <tbody id="roster-tbody" class="divide-y divide-slate-100 text-slate-600">
            <tr>
              <td colspan="5" class="py-6 text-center text-slate-400">名冊載入中...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const LIFF_ID = "2012065855-mDY8iWmz";
    // 全新有效的 GAS API 網址
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyzKdwldP0dW6FK6sMwz4LVF89njztvzLiODozGtNf_kdKZfHHM1u84yX43cq5eOs7skg/exec";
    const ACTIVITY_ID = "running-cub-run26";
    let submitted = false;

    let currentUser = {
      lineUserId: "",
      nickname: "",
      avatarUrl: ""
    };

    function bindPaceButtons() {
      const paceBtns = document.querySelectorAll('.pace-btn');
      const planInput = document.getElementById('input-plan');
      paceBtns.forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          const plan = this.getAttribute('data-plan');
          if (planInput && plan) {
            planInput.value = plan;
            planInput.focus();
            planInput.classList.add('ring-2', 'ring-emerald-400');
            setTimeout(() => planInput.classList.remove('ring-2', 'ring-emerald-400'), 250);
          }
        });
      });
    }

    async function initApp() {
      bindPaceButtons();

      try {
        if (window.liff) {
          await liff.init({ liffId: LIFF_ID });
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            currentUser.lineUserId = profile.userId;
            currentUser.nickname = profile.displayName;
            currentUser.avatarUrl = profile.pictureUrl || "";

            document.getElementById('liff-profile-card').classList.remove('hidden');
            document.getElementById('user-name').innerText = currentUser.nickname;
            if (currentUser.avatarUrl) {
              document.getElementById('user-avatar').src = currentUser.avatarUrl;
            }
            document.getElementById('input-nickname').value = currentUser.nickname;
          } else if (liff.isInClient()) {
            liff.login();
            return;
          }
        }
      } catch (err) {
        console.warn("LIFF 略過:", err);
      }

      if (!currentUser.lineUserId) {
        currentUser.lineUserId = "USER_" + Math.random().toString(36).substring(2, 9);
      }
      document.getElementById('hidden-line-id').value = currentUser.lineUserId;

      // 載入名冊
      loadRosterDirectly();
    }

    // 透過 Google Apps Script JSONP 讀取名單
    function loadRosterDirectly() {
      const connPill = document.getElementById('conn-pill');
      const connText = document.getElementById('conn-text');
      if (connText) connText.innerText = "讀取名單中...";

      const scriptId = "dynamic-jsonp-script";
      const oldScript = document.getElementById(scriptId);
      if (oldScript) oldScript.remove();

      window.renderRosterCallback = function(data) {
        if (data && data.status === "success") {
          connPill.className = "flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200";
          connText.innerText = "已連線雲端";
          renderTable(data.participants || []);
        }
      };

      const script = document.createElement("script");
      script.id = scriptId;
      script.src = `${GAS_API_URL}?activity_id=${ACTIVITY_ID}&callback=renderRosterCallback&_=${Date.now()}`;
      script.onerror = function() {
        if (connPill) connPill.className = "flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-red-50 text-red-700 border border-red-200";
        if (connText) connText.innerText = "連線檢查中";
      };
      document.body.appendChild(script);
    }

    function renderTable(list) {
      const tbody = document.getElementById('roster-tbody');
      document.getElementById('stat-count').innerText = list.length;

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-400">目前尚無人報名，搶當第 1 位！</td></tr>`;
        return;
      }

      let html = "";
      list.forEach((p, idx) => {
        const isWaitlist = p.status === "候補";
        const badgeClass = isWaitlist 
          ? "bg-amber-50 text-amber-700 border-amber-200" 
          : "bg-emerald-50 text-emerald-700 border-emerald-200";

        html += `
          <tr class="hover:bg-slate-50 transition">
            <td class="py-2 px-1 font-mono text-slate-400">${idx + 1}</td>
            <td class="py-2 px-2 font-medium text-slate-800">${escapeHtml(p.nickname || "")}</td>
            <td class="py-2 px-2">${escapeHtml(p.running_plan || "")}</td>
            <td class="py-2 px-2 text-slate-400">${escapeHtml(p.note || "-")}</td>
            <td class="py-2 px-1 text-right">
              <span class="inline-block px-1.5 py-0.5 rounded text-[10px] border ${badgeClass}">
                ${p.status || "成功"}
              </span>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    // 表單送出
    document.getElementById('reg-form').addEventListener('submit', function() {
      submitted = true;
      const btn = document.getElementById('btn-submit');
      const btnText = document.getElementById('btn-text');
      btn.disabled = true;
      btnText.innerText = "資料寫入中...";
    });

    // 接收完成通知
    function onFormSubmitSuccess() {
      const btn = document.getElementById('btn-submit');
      const btnText = document.getElementById('btn-text');
      const msg = document.getElementById('form-msg');

      btn.disabled = false;
      btnText.innerText = "已送出（可再次修改）";
      msg.className = "p-3 rounded-xl text-xs bg-emerald-50 text-emerald-800 border border-emerald-200 block";
      msg.innerHTML = `<strong>🎉 報名資料已成功送出！</strong><br>名冊已同步更新至 Google 試算表。`;

      setTimeout(loadRosterDirectly, 1000);

      if (window.liff && liff.isInClient()) {
        setTimeout(() => { liff.closeWindow(); }, 2500);
      }
      submitted = false;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }

    document.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
